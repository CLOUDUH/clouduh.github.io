---
layout: default
---

<header class="intro-header home-hero" style="background-image: url('{{ site.baseurl }}/{% if page.header-img %}{{ page.header-img }}{% else %}{{ site.header-img }}{% endif %}')">
    <div class="container">
        <div class="row">
            <div class="col-lg-10 col-lg-offset-1 col-md-10 col-md-offset-1">
                <div class="site-heading">
                    <h1>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</h1>
                    <span class="subheading">{{ site.home_page.hero_subtitle }}</span>
                </div>
            </div>
        </div>
    </div>
</header>

<main class="container home-main">
    {{ content }}
</main>
